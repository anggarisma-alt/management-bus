<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>SiBus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Percepat koneksi pertama ke Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="progress" class="progress" aria-hidden="true"></div>
  <div id="net" class="netbar" role="status" hidden>Tidak ada koneksi internet. Data terakhir tetap bisa dilihat.</div>

  <!-- LOGIN -->
  <section id="login" class="login" hidden>
    <form class="login-card" onsubmit="doLogin(event)" autocomplete="on">
      <div class="logo" aria-hidden="true"></div>
      <h1>SiBus</h1>
      <p class="muted">Booking &amp; penjadwalan armada bus pariwisata</p>
      <div class="f"><label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none" required></div>
      <div class="f"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div class="err-box" id="lerr" role="alert" hidden></div>
      <button class="btn primary lg" id="lbtn" type="submit">Masuk</button>
      <button class="btn ghost" type="button" onclick="toggleTheme()">Ganti tema terang/gelap</button>
    </form>
  </section>

  <!-- APLIKASI (SPA: konten dirender oleh router hash di app.js) -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side"></aside>
    <div class="main">
      <header class="top" id="top"></header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <nav class="bnav" id="bnav" aria-label="Menu utama"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="printRoot" aria-hidden="true"></div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
